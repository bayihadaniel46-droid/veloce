services:
  - type: web
    name: veloce-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: PIZ_API_URL
        value: https://piz-ledger.onrender.com
      - key: PIZ_SERVICE_KEY
        sync: false
